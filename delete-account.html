<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Frostforge - Delete account</title>
<style>
  :root { --bg:#f6f8fb; --fg:#14202e; --card:#fff; --mut:#5b6b7d; --acc:#1d6fb8; --bad:#b3261e; --bd:#d5dde6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1620; --fg:#e6edf5; --card:#16212d; --mut:#9aa9ba; --acc:#5aa9ee; --bad:#ff8a80; --bd:#2a3846; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px; margin:16px 0; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--bd); background:var(--card); color:var(--fg); cursor:pointer; margin:4px 4px 4px 0; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.danger { background:var(--bad); color:#fff; border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .mut { color:var(--mut); font-size:14px; }
  .err { color:var(--bad); }
  select { font:inherit; padding:4px; }
  header { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:22px; margin:8px 0; }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></header>
  <div class="card" id="view"></div>
  <p class="mut" id="foot"></p>
</main>
<script>
"use strict";
const T = {
  en: {
    title: "Delete your Frostforge account",
    intro: "Sign in with the Google or Apple account you use in the game. Your account is first disabled for 30 days (you can restore it any time in that period); after that, your save and data are permanently deleted automatically.",
    google: "Sign in with Google", apple: "Sign in with Apple",
    unavailable: "Sign-in is not available right now. Please try again later.",
    working: "Working...",
    activeMsg: "Your account is active. Deleting it disables it now and permanently deletes everything on %D (30 days from today). You can restore it before then.",
    del: "Delete my account", confirm: "I understand and want to delete my account",
    disabledMsg: "Your account is scheduled for permanent deletion on %D. Restore it to keep playing.",
    restore: "Restore my account",
    doneDel: "Done. Your account is disabled and will be permanently deleted on %D. Come back to this page before then to restore it.",
    doneRes: "Your account was restored. You can open the game again.",
    gone: "This account has already been permanently deleted.",
    recent: "This account was restored recently. Deleting again is blocked for 24 hours. Try again later.",
    failed: "Something went wrong. Please try again.", expired: "Your sign-in expired. Please sign in again.",
    signout: "Sign out",
    noGame: "This Google or Apple account has no game account, so there is nothing to delete. Check that you signed in with the account you use in the game.",
    disabledNoDate: "Your account is scheduled for permanent deletion within 30 days of the request. Restore it to keep playing.",
    doneDelNoDate: "Your account is disabled and will be permanently deleted within 30 days. Come back to this page before then to restore it.",
    foot: "Privacy policy: see the link on the store page. Questions: playfrostforge@gmail.com"
  },
  pt: {
    title: "Excluir sua conta do Frostforge",
    intro: "Entre com a conta Google ou Apple que você usa no jogo. Sua conta é primeiro desativada por 30 dias (você pode restaurá-la quando quiser nesse período); depois disso, seu progresso e seus dados são excluídos permanentemente, de forma automática.",
    google: "Entrar com o Google", apple: "Entrar com a Apple",
    unavailable: "O login não está disponível agora. Tente novamente mais tarde.",
    working: "Processando...",
    activeMsg: "Sua conta está ativa. Excluir desativa a conta agora e apaga tudo permanentemente em %D (30 dias a partir de hoje). Você pode restaurá-la antes disso.",
    del: "Excluir minha conta", confirm: "Entendo e quero excluir minha conta",
    disabledMsg: "Sua conta está programada para exclusão permanente em %D. Restaure para continuar jogando.",
    restore: "Restaurar minha conta",
    doneDel: "Pronto. Sua conta está desativada e será excluída permanentemente em %D. Volte a esta página antes disso para restaurá-la.",
    doneRes: "Sua conta foi restaurada. Você já pode abrir o jogo de novo.",
    gone: "Esta conta já foi excluída permanentemente.",
    recent: "Esta conta foi restaurada há pouco. Uma nova exclusão fica bloqueada por 24 horas. Tente mais tarde.",
    failed: "Algo deu errado. Tente novamente.", expired: "Seu login expirou. Entre novamente.",
    signout: "Sair",
    noGame: "Esta conta Google ou Apple não tem conta no jogo, então não há nada para excluir. Confira se você entrou com a conta que usa no jogo.",
    disabledNoDate: "Sua conta está programada para exclusão permanente em até 30 dias após o pedido. Restaure para continuar jogando.",
    doneDelNoDate: "Sua conta está desativada e será excluída permanentemente em até 30 dias. Volte a esta página antes disso para restaurá-la.",
    foot: "Política de privacidade: veja o link na página da loja. Dúvidas: playfrostforge@gmail.com"
  },
  es: {
    title: "Eliminar tu cuenta de Frostforge",
    intro: "Inicia sesión con la cuenta de Google o Apple que usas en el juego. Tu cuenta se desactiva primero por 30 días (puedes restaurarla cuando quieras en ese lapso); después, tu progreso y tus datos se eliminan de forma permanente y automática.",
    google: "Iniciar sesión con Google", apple: "Iniciar sesión con Apple",
    unavailable: "El inicio de sesión no está disponible ahora. Inténtalo más tarde.",
    working: "Procesando...",
    activeMsg: "Tu cuenta está activa. Al eliminarla se desactiva ahora y todo se borra de forma permanente el %D (30 días desde hoy). Puedes restaurarla antes.",
    del: "Eliminar mi cuenta", confirm: "Entiendo y quiero eliminar mi cuenta",
    disabledMsg: "Tu cuenta está programada para eliminarse de forma permanente el %D. Restáurala para seguir jugando.",
    restore: "Restaurar mi cuenta",
    doneDel: "Listo. Tu cuenta está desactivada y se eliminará de forma permanente el %D. Vuelve a esta página antes para restaurarla.",
    doneRes: "Tu cuenta fue restaurada. Ya puedes abrir el juego de nuevo.",
    gone: "Esta cuenta ya fue eliminada de forma permanente.",
    recent: "Esta cuenta se restauró hace poco. Volver a eliminarla está bloqueado por 24 horas. Inténtalo más tarde.",
    failed: "Algo salió mal. Inténtalo de nuevo.", expired: "Tu sesión expiró. Inicia sesión de nuevo.",
    signout: "Cerrar sesión",
    noGame: "Esta cuenta de Google o Apple no tiene una cuenta del juego, así que no hay nada que eliminar. Comprueba que iniciaste sesión con la cuenta que usas en el juego.",
    disabledNoDate: "Tu cuenta está programada para su eliminación permanente dentro de 30 días desde la solicitud. Restáurala para seguir jugando.",
    doneDelNoDate: "Tu cuenta está desactivada y se eliminará de forma permanente dentro de 30 días. Vuelve a esta página antes para restaurarla.",
    foot: "Política de privacidad: consulta el enlace en la página de la tienda. Dudas: playfrostforge@gmail.com"
  }
};
const $ = (id) => document.getElementById(id);
let lang = "en", cfg = null, token = "", me = null, note = "", busy = false;
try { lang = localStorage.getItem("ff_lang") || ""; } catch (e) { lang = ""; }
if (!T[lang]) lang = (navigator.language || "en").slice(0, 2);
if (!T[lang]) lang = "en";
const t = (k) => T[lang][k];
const fmt = (ms) => new Date(ms).toLocaleDateString(lang, { year: "numeric", month: "long", day: "numeric" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function b64url(buf) {
  let s = ""; new Uint8Array(buf).forEach((b) => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function rand(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }
const redirectUri = () => location.origin + location.pathname;

async function signIn(provider) {
  const verifier = rand(48), state = rand(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  try { sessionStorage.setItem("ff_pkce", JSON.stringify({ verifier, state })); } catch (e) { note = t("failed"); render(); return; }
  const q = new URLSearchParams({ response_type: "code", client_id: cfg.clientId, redirect_uri: redirectUri(), scope: "openid aws.cognito.signin.user.admin",
    state, code_challenge: challenge, code_challenge_method: "S256", identity_provider: provider });
  location.assign(cfg.hostedUi.replace(/\/$/, "") + "/oauth2/authorize?" + q);
}

async function exchange(code, state) {
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem("ff_pkce") || "null"); sessionStorage.removeItem("ff_pkce"); } catch (e) { p = null; }
  if (!p || p.state !== state) throw new Error("state");
  const body = new URLSearchParams({ grant_type: "authorization_code", client_id: cfg.clientId, code, redirect_uri: redirectUri(), code_verifier: p.verifier });
  const r = await fetch(cfg.hostedUi.replace(/\/$/, "") + "/oauth2/token", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" }, body });
  if (!r.ok) throw new Error("token");
  return (await r.json()).id_token;
}

// A federated identity never linked to a game account is an empty Google_/SignInWithApple_ user.
function unlinked(tok) {
  try {
    const pl = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    const u = String(pl["cognito:username"] || "");
    return u.startsWith("Google_") || u.startsWith("SignInWithApple_");
  } catch (e) { return false; }
}
const when = (v, withKey, withoutKey) => (Number(v) > 0 ? t(withKey).replace("%D", fmt(secs(v))) : t(withoutKey));

async function api(method, path, body) {
  const r = await fetch(cfg.apiBase.replace(/\/$/, "") + path, { method, headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) { j = null; }
  return { status: r.status, json: j || {} };
}

// Normalises GET /v1/me to a state: active | disabled | deleted.
async function refresh() {
  if (unlinked(token)) { me = { state: "unlinked" }; return; }
  const r = await api("GET", "/v1/me");
  if (r.status === 401) { token = ""; me = null; note = t("expired"); return; }
  if (r.status === 410) { me = { state: "deleted" }; return; }
  if (r.status === 423) { me = { state: "disabled", purgeAt: r.json.purgeAt }; return; }
  if (r.status !== 200) throw new Error("me");
  me = r.json.status === "disabled" ? { state: "disabled", purgeAt: r.json.purgeAt } : { state: "active" };
}
const secs = (v) => (v < 1e12 ? v * 1000 : v); // purgeAt is epoch seconds

async function act(fn) {
  if (busy) return; busy = true; note = ""; render();
  try { await fn(); } catch (e) { note = t("failed"); }
  busy = false; render();
}

async function doDelete() {
  const r = await api("DELETE", "/v1/me");
  if (r.status === 202) { me = { state: "disabled", purgeAt: r.json.purgeAt }; note = when(r.json.purgeAt, "doneDel", "doneDelNoDate"); }
  else if (r.status === 204 || r.status === 410) { me = { state: "deleted" }; }
  else if (r.status === 429) note = t("recent");
  else if (r.status === 401) { token = ""; me = null; note = t("expired"); }
  else throw new Error("del");
}
async function doRestore() {
  const r = await api("POST", "/v1/me/restore", {});
  if (r.status === 200) { me = { state: "active" }; note = t("doneRes"); }
  else if (r.status === 410) me = { state: "deleted" };
  else if (r.status === 401) { token = ""; me = null; note = t("expired"); }
  else throw new Error("res");
}

function render() {
  document.documentElement.lang = lang;
  $("title").textContent = t("title"); $("foot").textContent = t("foot"); $("lang").value = lang;
  const v = $("view");
  let h = "";
  if (busy) h = "<p>" + esc(t("working")) + "</p>";
  else if (!cfg || !cfg.apiBase || !cfg.hostedUi || !cfg.clientId) h = '<p class="err">' + esc(t("unavailable")) + "</p>";
  else if (!token || !me) {
    h = "<p>" + esc(t("intro")) + "</p>";
    if (note) h += '<p class="err">' + esc(note) + "</p>";
    if (cfg.google !== false) h += '<button class="primary" id="g">' + esc(t("google")) + "</button>";
    if (cfg.apple) h += '<button class="primary" id="a">' + esc(t("apple")) + "</button>";
  } else {
    if (note) h += "<p>" + esc(note) + "</p>";
    if (me.state === "unlinked") h += "<p>" + esc(t("noGame")) + "</p>";
    else if (me.state === "deleted") h += "<p>" + esc(t("gone")) + "</p>";
    else if (me.state === "disabled") {
      h += "<p>" + esc(when(me.purgeAt, "disabledMsg", "disabledNoDate")) + '</p><button class="primary" id="r">' + esc(t("restore")) + "</button>";
    } else {
      const d = Date.now() + 30 * 864e5;
      h += "<p>" + esc(t("activeMsg").replace("%D", fmt(d))) + '</p><label><input type="checkbox" id="c"> ' + esc(t("confirm")) + '</label><p><button class="danger" id="d" disabled>' + esc(t("del")) + "</button></p>";
    }
    h += '<button id="o">' + esc(t("signout")) + "</button>";
  }
  v.innerHTML = h;
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on("g", () => signIn("Google")); on("a", () => signIn("SignInWithApple"));
  on("d", () => act(doDelete)); on("r", () => act(doRestore));
  on("o", () => { token = ""; me = null; note = ""; render(); });
  const c = $("c"); if (c) c.onchange = () => { $("d").disabled = !c.checked; };
}

$("lang").onchange = (e) => { lang = e.target.value; try { localStorage.setItem("ff_lang", lang); } catch (x) { /* ignore */ } render(); };

(async function init() {
  render();
  try { const r = await fetch("delete-account-config.json", { cache: "no-cache" }); cfg = await r.json(); } catch (e) { cfg = null; }
  const q = new URLSearchParams(location.search);
  if (cfg && q.get("code")) {
    const code = q.get("code"), state = q.get("state") || "";
    history.replaceState(null, "", location.pathname); // never keep the code in the URL/history
    await act(async () => { token = await exchange(code, state); await refresh(); });
  } else if (q.get("error")) { history.replaceState(null, "", location.pathname); note = t("failed"); }
  render();
})();
</script>
</body>
</html>
